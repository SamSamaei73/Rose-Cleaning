name: Validate and deploy Rose

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      TEST_DATABASE_URL: postgresql://postgres:${{ github.run_id }}@127.0.0.1:5432/postgres
      ROSE_RELEASE_SHA: ${{ github.sha }}
      ROSE_RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and unit/deployment tests
        run: |
          npx next typegen
          npm run typecheck
          npm run lint
          npm test
          bash -n scripts/deploy-via-ssh.sh
      - name: Install database test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client ripgrep
      - name: Verify migrations, RLS and transactional behavior
        run: npm run test:db
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser journeys
        run: npm run test:e2e
      - name: Require production public configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'Set NEXT_PUBLIC_SUPABASE_URL in repository variables.'; exit 1; }
          test -n "$SUPABASE_KEY" || { echo 'Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in repository variables.'; exit 1; }
      - name: Build the Linux production artifact
        env:
          ROSE_BUILD_TARGET: cpanel
          APP_MODE: connected
          NEXT_PUBLIC_SITE_URL: https://rosecleaning.uk
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          npm run package:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rose-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/*.tar.gz
            build/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://rosecleaning.uk
    concurrency:
      group: rose-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rose-${{ github.run_id }}-${{ github.run_attempt }}
          path: build
      - name: Deploy and verify the release, reverting if verification fails
        env:
          KRYSTAL_SSH_PRIVATE_KEY: ${{ secrets.KRYSTAL_SSH_PRIVATE_KEY }}
          KRYSTAL_SSH_KNOWN_HOSTS: ${{ vars.KRYSTAL_SSH_KNOWN_HOSTS }}
          ROSE_RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/deploy-via-ssh.sh deploy "$ROSE_RELEASE_ID"
      - name: Record deployment
        run: |
          echo 'Verified https://rosecleaning.uk' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: ${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_STEP_SUMMARY"
